<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spice Route – Order Food Online</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Spice Route Kitchen</h1>
  <p>Browse, add to cart, review and place your order.</p>
</header>
<main>
  <section aria-label="Menu">
    <div class="tools">
      <input id="search" type="search" placeholder="Search dishes by name" aria-label="Search by name">
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="grid" id="menu"></div>
    <p class="empty hidden" id="noResults">No dishes match your search. Try another name or category.</p>
  </section>
  <aside aria-label="Your order">
    <h2>Your order</h2>
    <div id="msg"></div>
    <div id="cart"></div>
    <div id="checkout" class="hidden">
      <div class="total"><span>Total</span><span id="total"></span></div>
      <form id="form" novalidate>
        <label>Name<input name="name" autocomplete="name"><span class="err"></span></label>
        <label>Phone<input name="phone" inputmode="tel" autocomplete="tel"><span class="err"></span></label>
        <label>Delivery address<input name="address" autocomplete="street-address"><span class="err"></span></label>
        <button class="btn" type="submit">Place order</button>
        <button class="btn ghost" type="button" id="clear">Clear cart</button>
      </form>
    </div>
  </aside>
</main>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
